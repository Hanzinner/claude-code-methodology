# Install smoke test and the repo's tests on Linux (the reference) and "macos stock": PATH cut to the system dirs, as on
# a Mac without Homebrew (/bin/bash 3.2, BSD stat, date, readlink; no timeout, flock). A plain macos-latest job without
# the cut gave the same /bin/bash 3.2 (no Homebrew bash on the runner) and only doubled the wait for macOS runners. Runs on every push and by hand. Nothing here needs a secret.
name: platforms
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, path: "" }
          - { name: macos-stock, os: macos-latest, path: "/usr/bin:/bin:/usr/sbin:/sbin" }
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: install smoke test (throwaway HOME)
        env:
          SMOKE_CRON: "1"
          STOCK_PATH: ${{ matrix.path }}
        shell: /bin/bash {0}
        run: |
          # stock: no Homebrew bash either (the runner has one on disk; install.sh would start the hooks through it)
          [ -n "$STOCK_PATH" ] && export PATH="$STOCK_PATH" CCM_BASH_CANDIDATES=""
          echo "PATH=$PATH"; /bin/bash tests/platform-smoke.sh
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, path: "" }
          - { name: macos-stock, os: macos-latest, path: "/usr/bin:/bin:/usr/sbin:/sbin" }
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: repo tests (each file on its own; the list of failures is at the end)
        env:
          CCM_TEST: "1"
          STOCK_PATH: ${{ matrix.path }}
        shell: /bin/bash {0}
        run: |
          [ -n "$STOCK_PATH" ] && export PATH="$STOCK_PATH" CCM_BASH_CANDIDATES=""
          # macOS has no `timeout`: perl's alarm does the same everywhere (one red test must not stop the loop: no -e)
          limit() { perl -e 'alarm shift; exec @ARGV or die "exec: $!"' 300 "$@"; }
          fails=""; n=0
          for t in tests/*-test.sh tests/*-test.py; do
            case $t in *install-windows-test.sh) continue ;; esac
            n=$((n+1))
            echo "::group::$t"
            if [ "${t%.py}" != "$t" ]; then limit python3 "$t"; else limit /bin/bash "$t"; fi
            rc=$?
            echo "::endgroup::"
            [ $rc = 0 ] || { echo "FAILED: $t rc=$rc"; fails="$fails $t"; }   # in the log; one annotation below names all
          done
          set -- $fails
          echo "ran $n, failed $#:"; for f in "$@"; do echo "  $f"; done
          # one annotation with every name: GitHub shows only 10 annotations per step and no logs without a login
          [ $# = 0 ] || echo "::error::failed $# of $n:$(for f in "$@"; do printf ' %s' "${f#tests/}"; done)"
          [ $# = 0 ]
